[env:esp32dev]
platform = espressif32@6.9.0
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600
build_flags =
    -std=gnu++17
    -Wall
    -Wextra
    -Werror
build_unflags = -std=gnu++11
lib_deps =
    FS
    LittleFS

[env:native]
platform = native
test_framework = unity
build_flags =
    -std=gnu++17
    -Wall
    -Wextra
    -D UNIT_TEST
    -D NATIVE_BUILD


